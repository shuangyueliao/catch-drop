<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Catch Drop — move your basket, catch falling fruit, build combo multipliers and dodge bombs. Free single-file HTML5 game.">
<title>Catch Drop · Fruit Catching Arcade</title>
<script>
// ===== 平台 SDK 按域名条件加载（取自 game/index.html，原样保留）=====
// crazygames 域加载 CG SDK + gameplayStart/gameplayStop；gamedistribution/gd.games 域加载 GD SDK；其他域不加载
(function () {
  var host = location.hostname || "";
  try {
    if (host.indexOf("crazygames") !== -1) {
      var s1 = document.createElement("script");
      s1.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js";
      s1.onload = function () {
        if (window.CrazyGames && window.CrazyGames.SDK) {
          window.CrazyGames.SDK.init().then(function () {
            try { window.CrazyGames.SDK.game.loadingStart(); } catch (e) {}
            window.addEventListener("load", function () { try { window.CrazyGames.SDK.game.loadingStop(); } catch (e) {} });
          }).catch(function () {});
        }
      };
      document.head.appendChild(s1);
      window.__portal = "crazygames";
    } else if (host.indexOf("gamedistribution") !== -1 || host.indexOf("html5.gamedistribution.com") !== -1 || host.indexOf("gd.games") !== -1) {
      var s2 = document.createElement("script");
      s2.src = "https://sdk.gamedistribution.com/v2/main.min.js";
      document.head.appendChild(s2);
      window.__portal = "gamedistribution";
    }
  } catch (e) {}
})();
</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#26401f; font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #hud { width:100%; max-width:480px; display:flex; justify-content:space-between; align-items:center; padding:8px 10px 4px; color:#f2f7ec; }
  .stat { text-align:center; }
  .stat .label { font-size:10px; color:#b7cba4; letter-spacing:1px; }
  .stat .val { font-size:19px; font-weight:800; }
  #combo { color:#ffd75e; }
  #lives { color:#ff7b6b; }
  #mute { background:rgba(255,255,255,.12); color:#e8f0dc; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:5px 7px; font-size:10px; font-weight:700; cursor:pointer; letter-spacing:.5px; }
  #mute:active { transform:scale(.95); }
  #stage { position:relative; }
  canvas { display:block; border-radius:14px; touch-action:none; background:#8fd4f5; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(16,28,12,.62); border-radius:14px; z-index:5; }
  #panel { background:#2b4223; border:1px solid #49663b; border-radius:18px; padding:24px 30px; text-align:center; color:#fff; max-width:88%; }
  #panel h2 { font-size:24px; margin-bottom:8px; letter-spacing:1px; }
  #panel p { color:#c9dcb6; font-size:13px; margin-bottom:12px; line-height:1.6; }
  #panel .final { font-size:32px; font-weight:900; color:#ffd75e; margin-bottom:12px; }
  #panel .newbest { color:#7dffa1; font-weight:800; font-size:14px; margin-bottom:10px; }
  #mainBtn { background:linear-gradient(135deg,#ff8a3c,#f4542e); color:#fff; border:none; border-radius:12px; padding:12px 38px; font-size:16px; font-weight:800; cursor:pointer; }
  #mainBtn:active { transform:scale(.97); }
  #footer { color:#9db389; font-size:11px; padding:6px; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><div class="label">SCORE</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">COMBO</div><div class="val" id="combo">&mdash;</div></div>
    <div class="stat"><div class="label">LIVES</div><div class="val" id="lives">&hearts;&hearts;&hearts;</div></div>
    <div class="stat"><div class="label">BEST</div><div class="val" id="best">0</div></div>
    <button id="mute">SOUND ON</button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay"><div id="panel">
      <h2 id="ovTitle">CATCH DROP</h2>
      <p id="ovText"></p>
      <div class="final hide" id="finalScore"></div>
      <div class="newbest hide" id="newBest">NEW BEST!</div>
      <button id="mainBtn">Play</button>
    </div></div>
  </div>
  <div id="footer">Catch Drop &mdash; a free fruit catching game</div>
</div>
<script>
"use strict";
// ---------- 画布与自适应 ----------
var W = 480, H = 700;
var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);
function fit() {
  // canvas 按窗口缩放，保持 480x700 比例（内部逻辑分辨率不变）
  var hudH = document.getElementById("hud").offsetHeight;
  var footH = document.getElementById("footer").offsetHeight;
  var availW = window.innerWidth - 8;
  var availH = window.innerHeight - hudH - footH - 10;
  var s = Math.min(availW / W, availH / H, 1);
  s = Math.max(s, 0.25);
  canvas.style.width = Math.round(W * s) + "px";
  canvas.style.height = Math.round(H * s) + "px";
}
window.addEventListener("resize", fit);

// ---------- 游戏状态 ----------
var BASKET_W = 98, BASKET_H = 52, RIM_DEPTH = 16;
var basket = { x: W / 2, y: H - 92, stun: 0 };   // stun > 0 时篮子眩晕不能动
var state = "MENU";                               // MENU | PLAY | OVER
var score = 0, best = 0, lives = 3, combo = 0, missStreak = 0;
var runPrevBest = 0, newBestFlag = false;
var items = [];      // 下落物 {type,x,y,r,vy,rot,spin}
var particles = [];  // 果汁飞溅
var floats = [];     // 浮动分数
var leaves = [];     // 飘落叶子装饰
var clouds = [];
var elapsed = 0, spawnT = 0.6, flash = 0, shake = 0, nowSec = 0;
var keys = { left: false, right: false };
var LEAF_COLORS = ["#e8a33d", "#c96f2e", "#7fae4e", "#d9b23c", "#b5533c"];
try { best = parseInt(localStorage.getItem("cd_best") || "0", 10) || 0; } catch (e) {}
var muted = false;
try { muted = localStorage.getItem("cd_muted") === "1"; } catch (e) {}

// ---------- 难度曲线 ----------
function fallSpeed() { return Math.min(480, 165 + elapsed * 6); }
function spawnInterval() { return Math.max(0.45, 1.05 - elapsed * 0.008); }
function bombChance() { return Math.min(0.20, 0.08 + elapsed * 0.0035); }

// ---------- 生成下落物 ----------
function pickType() {
  var roll = Math.random();
  if (roll < bombChance()) return "bomb";
  if (roll < bombChance() + 0.08) return "gold";   // 金苹果稀有（约 8%）
  return Math.random() < 0.5 ? "apple" : "orange";
}
function spawnItem() {
  var r = 15;
  var type = pickType();
  var x = W / 2, ok = false;
  // X 间隔保护：多次尝试，避开仍在高处（y<160）的其他落物，防止生成即重叠
  for (var tries = 0; tries < 12 && !ok; tries++) {
    x = 30 + Math.random() * (W - 60);
    ok = true;
    for (var i = 0; i < items.length; i++) {
      if (items[i].y < 160 && Math.abs(items[i].x - x) < items[i].r * 2 + 16) { ok = false; break; }
    }
  }
  items.push({ type: type, x: x, y: -r - 8, r: r, vy: fallSpeed() * (0.9 + Math.random() * 0.25),
               rot: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 1.6 });
}

// ---------- 碰撞：篮口矩形 vs 物圆（最近点法） ----------
function catches(it) {
  var rx = basket.x - BASKET_W / 2, ry = basket.y, rw = BASKET_W, rh = RIM_DEPTH;
  var cx = Math.max(rx, Math.min(it.x, rx + rw));
  var cy = Math.max(ry, Math.min(it.y, ry + rh));
  var dx = it.x - cx, dy = it.y - cy;
  return dx * dx + dy * dy <= it.r * it.r;
}

// ---------- 音效（WebAudio 合成：接住/金苹果/炸弹/漏接 四种） ----------
var actx = null;
function audio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
  return actx;
}
function beep(freq, dur, type, gainv, delay, slideTo) {
  try {
    var a = audio(); if (!a || muted) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(gainv || 0.1, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function sCatch() { beep(520, 0.08, "triangle", 0.10, 0, 780); }                       // 接住
function sGold()  { beep(660, 0.09, "sine", 0.11); beep(880, 0.09, "sine", 0.11, 0.08); beep(1320, 0.15, "sine", 0.10, 0.16); } // 金苹果
function sMiss()  { beep(300, 0.12, "sine", 0.06, 0, 180); }                            // 漏接
function sBomb()  { noiseBurst(); beep(90, 0.35, "sawtooth", 0.14, 0, 40); }            // 炸弹
function noiseBurst() {
  try {
    var a = audio(); if (!a || muted) return;
    var len = Math.floor(a.sampleRate * 0.3);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = a.createBufferSource(); src.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    var g = a.createGain(); g.gain.value = 0.18;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start();
  } catch (e) {}
}

// ---------- 特效 ----------
function splash(x, y, color, second) {
  var n = 10;
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 150;
    particles.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90,
                     life: 0.45 + Math.random() * 0.25, color: color, size: 2 + Math.random() * 3.5 });
  }
  if (second) { // 炸弹：灰烟 + 橙色火星
    for (var j = 0; j < 8; j++) {
      var a2 = Math.random() * Math.PI * 2, s2 = 40 + Math.random() * 170;
      particles.push({ x: x, y: y, vx: Math.cos(a2) * s2, vy: Math.sin(a2) * s2 - 60,
                       life: 0.5 + Math.random() * 0.3, color: second, size: 2 + Math.random() * 3 });
    }
  }
}
function floatText(x, y, text, color) { floats.push({ x: x, y: y, text: text, life: 0.9, color: color || "#fff" }); }

// ---------- 接住 / 漏接 ----------
function onCatch(it) {
  if (it.type === "bomb") {
    // 炸弹：-5 分、扣 1 命、屏幕闪红、篮子眩晕 0.5 秒
    score = Math.max(0, score - 5);
    combo = 0; missStreak = 0;
    lives--;
    basket.stun = 0.5;
    flash = 0.85; shake = 10;
    splash(it.x, it.y, "#555c66", "#ff9a3c");
    floatText(it.x, it.y - 20, "-5", "#ff5a5a");
    sBomb();
    updateHUD();
    if (lives <= 0) gameOver();
    return;
  }
  combo++; missStreak = 0;
  var mult = 1 + Math.min(combo, 8) * 0.1;         // 分数乘数 1+min(combo,8)x0.1
  var base = it.type === "gold" ? 5 : 1;
  var gain = Math.round(base * mult);
  score += gain;
  splash(it.x, it.y, it.type === "gold" ? "#ffd75e" : it.type === "orange" ? "#ff9a3c" : "#ff5a54");
  floatText(it.x, it.y - 18, "+" + gain, it.type === "gold" ? "#ffd75e" : "#ffffff");
  if (it.type === "gold") sGold(); else sCatch();
  if (score > best) {
    best = score;
    if (best > runPrevBest) newBestFlag = true;
    try { localStorage.setItem("cd_best", String(best)); } catch (e) {}
  }
  updateHUD();
}
function onMiss(it) {
  if (it.type === "bomb") return;                   // 漏掉炸弹不算漏接
  missStreak++;
  sMiss();
  if (missStreak >= 5) {                            // 连漏 5 个水果 combo 清零
    missStreak = 0;
    if (combo > 0) { combo = 0; floatText(W / 2, H * 0.35, "COMBO LOST", "#ff8a8a"); }
  }
  updateHUD();
}

// ---------- 流程 ----------
function startGame() {
  score = 0; lives = 3; combo = 0; missStreak = 0;
  items = []; particles = []; floats = [];
  elapsed = 0; spawnT = 0.6; flash = 0; shake = 0;
  basket.x = W / 2; basket.stun = 0;
  runPrevBest = best; newBestFlag = false;
  updateHUD();
  document.getElementById("overlay").classList.add("hide");
  state = "PLAY";
  audio(); // 预热音频（用户手势内）
  gameplayStart();
}
function gameOver() {
  state = "OVER";
  document.getElementById("ovTitle").textContent = "GAME OVER";
  document.getElementById("ovText").textContent = "Out of lives!";
  document.getElementById("finalScore").textContent = String(score);
  document.getElementById("finalScore").classList.remove("hide");
  var nb = document.getElementById("newBest");
  if (newBestFlag) nb.classList.remove("hide"); else nb.classList.add("hide");
  document.getElementById("mainBtn").textContent = "Play Again";
  document.getElementById("overlay").classList.remove("hide");
  gameplayStop(); // 平台埋点：一局结束
  if (newBestFlag) {
    try {
      if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
        window.CrazyGames.SDK.game.happytime();
      }
    } catch (e) {}
  }
}
// 平台埋点：开始/结束 gameplay（域名守卫在 loader，已做 try/catch）
function gameplayStart() {
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStart();
    }
  } catch (e) {}
}
function gameplayStop() {
  try {
    if (window.__portal === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.game.gameplayStop();
    }
  } catch (e) {}
}

// ---------- 更新 ----------
function update(dt) {
  // 装饰永远更新（菜单/结束界面也有生命感）
  for (var l = 0; l < leaves.length; l++) {
    var lf = leaves[l];
    lf.sway += dt * 1.2; lf.y += lf.vy * dt;
    lf.x += Math.sin(lf.sway) * 22 * dt; lf.rot += dt * 1.4;
    if (lf.y > H + 16) leaves[l] = newLeaf(false);
  }
  for (var c = 0; c < clouds.length; c++) {
    clouds[c].x += clouds[c].v * dt;
    if (clouds[c].x - 60 > W) clouds[c].x = -60;
  }
  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p];
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(p, 1); continue; }
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 420 * dt;
  }
  for (var f = floats.length - 1; f >= 0; f--) {
    var fl = floats[f]; fl.life -= dt; fl.y -= 46 * dt;
    if (fl.life <= 0) floats.splice(f, 1);
  }
  if (flash > 0) flash = Math.max(0, flash - dt * 1.6);
  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  if (state !== "PLAY") return;
  elapsed += dt;
  if (basket.stun > 0) basket.stun -= dt;
  if (basket.stun <= 0) {                            // 眩晕期间篮子不能动
    if (keys.left) basket.x -= 430 * dt;
    if (keys.right) basket.x += 430 * dt;
    basket.x = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, basket.x));
  }
  spawnT -= dt;
  if (spawnT <= 0) { spawnItem(); spawnT = spawnInterval(); }
  for (var i = items.length - 1; i >= 0; i--) {
    var it = items[i];
    it.y += it.vy * dt;
    it.rot += it.spin * dt;
    if (catches(it)) { onCatch(it); items.splice(i, 1); continue; }
    if (it.y - it.r > H + 10) { onMiss(it); items.splice(i, 1); }
  }
}

// ---------- 渲染 ----------
function drawLeafShape(x, y, s, rot, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(s * 0.7, 0, 0, s);
  ctx.quadraticCurveTo(-s * 0.7, 0, 0, -s);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -s * 0.8); ctx.lineTo(0, s * 0.8); ctx.stroke();
  ctx.restore();
}
function drawStar(x, y, spikes, outer, color) {
  var inner = outer * 0.45;
  ctx.fillStyle = color;
  ctx.beginPath();
  for (var i = 0; i < spikes * 2; i++) {
    var rr = (i % 2 === 0) ? outer : inner;
    var a = (i * Math.PI) / spikes - Math.PI / 2;
    var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}
function drawBackground() {
  var g = ctx.createLinearGradient(0, 0, 0, H);      // 果园渐变
  g.addColorStop(0, "#8fd4f5"); g.addColorStop(0.55, "#c8ecb0");
  g.addColorStop(0.8, "#8cc765"); g.addColorStop(1, "#6fae4b");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (var i = 0; i < clouds.length; i++) {          // 云
    var cl = clouds[i];
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.beginPath();
    ctx.arc(cl.x, cl.y, 18 * cl.s, 0, Math.PI * 2);
    ctx.arc(cl.x + 20 * cl.s, cl.y + 6 * cl.s, 14 * cl.s, 0, Math.PI * 2);
    ctx.arc(cl.x - 20 * cl.s, cl.y + 7 * cl.s, 13 * cl.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(60,110,45,.5)";              // 远处树冠
  ctx.beginPath();
  ctx.arc(60, 470, 46, 0, Math.PI * 2); ctx.arc(140, 452, 34, 0, Math.PI * 2);
  ctx.arc(390, 462, 50, 0, Math.PI * 2); ctx.arc(310, 480, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#5e9c40";                          // 地面
  ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = "rgba(255,255,255,.08)";
  ctx.fillRect(0, H - 40, W, 6);
  for (var l = 0; l < leaves.length; l++) {           // 飘落叶子装饰
    var lf = leaves[l];
    drawLeafShape(lf.x, lf.y, lf.size, lf.rot, lf.color, 0.8);
  }
}
function drawApple(x, y, r, rot, gold) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot * 0.3);
  if (gold) {                                         // 金苹果光晕
    var glow = ctx.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 1.7);
    glow.addColorStop(0, "rgba(255,215,90,.4)"); glow.addColorStop(1, "rgba(255,215,90,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, Math.PI * 2); ctx.fill();
  }
  var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r * 1.05);
  if (gold) { g.addColorStop(0, "#fff3b0"); g.addColorStop(0.45, "#ffd75e"); g.addColorStop(1, "#d99a17"); }
  else { g.addColorStop(0, "#ff9a8a"); g.addColorStop(0.45, "#f4442e"); g.addColorStop(1, "#b71c12"); }
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.12)";                  // 顶部凹陷
  ctx.beginPath(); ctx.ellipse(0, -r * 0.82, r * 0.32, r * 0.13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#7a4a20"; ctx.lineWidth = Math.max(2, r * 0.14); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r * 0.8); ctx.quadraticCurveTo(r * 0.1, -r * 1.15, r * 0.22, -r * 1.28); ctx.stroke(); // 果柄
  drawLeafShape(r * 0.36, -r * 1.02, r * 0.5, -0.5 + rot * 0.2, gold ? "#d9e86e" : "#3f9b2f", 1); // 叶子
  ctx.fillStyle = "rgba(255,255,255,.55)";            // 高光
  ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.42, r * 0.16, r * 0.26, -0.6, 0, Math.PI * 2); ctx.fill();
  if (gold) {                                         // 金苹果闪烁
    ctx.save();
    ctx.translate(r * 0.42, -r * 0.1);
    ctx.rotate(nowSec * 2);
    ctx.globalAlpha = 0.65 + 0.35 * Math.sin(nowSec * 9);
    drawStar(0, 0, 4, 6, "#ffffff");
    ctx.restore();
  }
  ctx.restore();
}
function drawOrange(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot * 0.3);
  var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r * 1.05);
  g.addColorStop(0, "#ffd08a"); g.addColorStop(0.45, "#ff9a2e"); g.addColorStop(1, "#d96c10");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(190,90,10,.4)";               // 皮孔
  for (var i = 0; i < 5; i++) {
    var a = i * 1.7 + 0.6, rr = r * 0.55;
    ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  drawLeafShape(r * 0.3, -r * 1.0, r * 0.45, -0.6 + rot * 0.2, "#3f9b2f", 1);
  ctx.fillStyle = "rgba(255,255,255,.5)";             // 高光
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.4, r * 0.15, r * 0.24, -0.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawBomb(x, y, r) {
  ctx.save();
  ctx.translate(x, y);
  var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.12, 0, 0, r * 1.1);
  g.addColorStop(0, "#6a6f7a"); g.addColorStop(0.5, "#2c3038"); g.addColorStop(1, "#12141a");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)";            // 高光
  ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.42, r * 0.13, r * 0.2, -0.7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#c9a06a"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r * 0.9); ctx.quadraticCurveTo(r * 0.35, -r * 1.35, r * 0.65, -r * 1.28); ctx.stroke(); // 引信
  var fl = 0.6 + 0.4 * Math.sin(nowSec * 22);         // 火花闪烁
  ctx.fillStyle = "rgba(255,120,30," + (fl * 0.8) + ")";
  ctx.beginPath(); ctx.arc(r * 0.65, -r * 1.28, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,200,60," + fl + ")";
  ctx.beginPath(); ctx.arc(r * 0.65, -r * 1.28, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 2; // 警示 X
  ctx.beginPath();
  ctx.moveTo(-r * 0.28, -r * 0.05); ctx.lineTo(r * 0.28, r * 0.5);
  ctx.moveTo(r * 0.28, -r * 0.05); ctx.lineTo(-r * 0.28, r * 0.5);
  ctx.stroke();
  ctx.restore();
}
function drawItem(it) {
  if (it.type === "apple") drawApple(it.x, it.y, it.r, it.rot, false);
  else if (it.type === "gold") drawApple(it.x, it.y, it.r, it.rot, true);
  else if (it.type === "orange") drawOrange(it.x, it.y, it.r, it.rot);
  else drawBomb(it.x, it.y, it.r);
}
function drawBasket() {
  var x = basket.x, y = basket.y;
  var topW = BASKET_W, botW = BASKET_W * 0.68, h = BASKET_H;
  ctx.save();
  if (basket.stun > 0) {                              // 眩晕：抖动 + 打转星星
    x += Math.sin(nowSec * 40) * 3;
    for (var s = 0; s < 3; s++) {
      var ang = nowSec * 7 + s * 2.09;
      drawStar(x + Math.cos(ang) * 26, y - 16 + Math.sin(ang) * 7, 5, 5, "#ffe36e");
    }
  }
  var grad = ctx.createLinearGradient(0, y, 0, y + h); // 篮身
  grad.addColorStop(0, "#c98a4b"); grad.addColorStop(1, "#8a5a2b");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(x - topW / 2, y); ctx.lineTo(x + topW / 2, y);
  ctx.lineTo(x + botW / 2, y + h); ctx.lineTo(x - botW / 2, y + h);
  ctx.closePath(); ctx.fill();
  ctx.save();                                          // 编织纹理（裁剪在篮身内）
  ctx.beginPath();
  ctx.moveTo(x - topW / 2, y); ctx.lineTo(x + topW / 2, y);
  ctx.lineTo(x + botW / 2, y + h); ctx.lineTo(x - botW / 2, y + h);
  ctx.closePath(); ctx.clip();
  ctx.strokeStyle = "rgba(90,55,20,.35)"; ctx.lineWidth = 2;
  for (var yy = y + 6; yy < y + h; yy += 8) {
    ctx.beginPath(); ctx.moveTo(x - topW / 2, yy); ctx.lineTo(x + topW / 2, yy); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(255,230,180,.22)";
  for (var xx = -topW; xx < topW; xx += 12) {
    ctx.beginPath(); ctx.moveTo(x + xx, y); ctx.lineTo(x + xx + 14, y + h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + xx, y + h); ctx.lineTo(x + xx + 14, y); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = "#7a4a20";                           // 篮口边框
  roundRect(ctx, x - topW / 2 - 4, y - 7, topW + 8, 14, 7); ctx.fill();
  ctx.fillStyle = "#9a6430";
  roundRect(ctx, x - topW / 2 - 4, y - 7, topW + 8, 6, 3); ctx.fill();
  ctx.restore();
}
function roundRect(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  for (var i = 0; i < items.length; i++) drawItem(items[i]);
  drawBasket();
  for (var p = 0; p < particles.length; p++) {         // 果汁飞溅粒子
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, Math.min(1, pt.life * 2));
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.font = "800 18px sans-serif"; ctx.textAlign = "center";
  for (var f = 0; f < floats.length; f++) {
    var fl = floats[f];
    ctx.globalAlpha = Math.max(0, Math.min(1, fl.life / 0.5));
    ctx.fillStyle = fl.color;
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) {                                     // 炸弹红闪
    ctx.fillStyle = "rgba(255,40,20," + (flash * 0.55) + ")";
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- 主循环 ----------
var last = 0;
function frame(t) {
  nowSec = t / 1000;
  var dt = Math.min((t - last) / 1000, 0.05); last = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 输入（移动触控 + 桌面鼠标/键盘） ----------
function setBasketX(clientX) {
  if (state !== "PLAY" || basket.stun > 0) return;     // 眩晕时忽略移动
  var rect = canvas.getBoundingClientRect();
  var x = (clientX - rect.left) / rect.width * W;
  basket.x = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, x));
}
canvas.addEventListener("mousemove", function (e) { setBasketX(e.clientX); });
canvas.addEventListener("mousedown", function (e) { audio(); setBasketX(e.clientX); });
canvas.addEventListener("touchstart", function (e) { e.preventDefault(); audio(); setBasketX(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener("touchmove", function (e) { e.preventDefault(); setBasketX(e.touches[0].clientX); }, { passive: false });
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft") { keys.left = true; e.preventDefault(); }
  else if (e.key === "ArrowRight") { keys.right = true; e.preventDefault(); }
  else if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    if (state !== "PLAY") startGame();
  }
});
document.addEventListener("keyup", function (e) {
  if (e.key === "ArrowLeft") keys.left = false;
  if (e.key === "ArrowRight") keys.right = false;
});
var mainBtn = document.getElementById("mainBtn");
mainBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  mainBtn.blur();
  if (state === "PLAY") return;                        // 防止误触重开
  audio();
  startGame();
});

// ---------- 静音 ----------
var muteBtn = document.getElementById("mute");
function applyMute() { muteBtn.textContent = muted ? "SOUND OFF" : "SOUND ON"; }
muteBtn.addEventListener("click", function (e) {
  e.stopPropagation();
  muted = !muted;
  try { localStorage.setItem("cd_muted", muted ? "1" : "0"); } catch (err) {}
  applyMute();
  muteBtn.blur();
});

// ---------- HUD / 菜单 ----------
function updateHUD() {
  document.getElementById("score").textContent = String(score);
  document.getElementById("combo").textContent = combo > 0 ? ("x" + (1 + Math.min(combo, 8) * 0.1).toFixed(1)) : "\u2014";
  var hearts = "";
  for (var i = 0; i < lives; i++) hearts += "\u2665";
  document.getElementById("lives").textContent = hearts || "\u2014";
  document.getElementById("best").textContent = String(best);
}
function showMenu() {
  document.getElementById("ovTitle").textContent = "CATCH DROP";
  document.getElementById("ovText").innerHTML =
    "Move the basket. Catch fruit, dodge bombs.<br>" +
    "Apple +1 &middot; Golden apple +5 &middot; Bomb &minus;5 and one life.<br>" +
    "Chain catches to grow your combo multiplier &mdash; drop 5 fruits and it resets!";
  document.getElementById("finalScore").classList.add("hide");
  document.getElementById("newBest").classList.add("hide");
  document.getElementById("mainBtn").textContent = "Play";
  document.getElementById("overlay").classList.remove("hide");
}

// ---------- 装饰初始化 ----------
function newLeaf(anyY) {
  return { x: Math.random() * W, y: anyY ? Math.random() * H : -20,
           size: 6 + Math.random() * 5, rot: Math.random() * Math.PI * 2,
           vy: 18 + Math.random() * 22, sway: Math.random() * Math.PI * 2,
           color: LEAF_COLORS[(Math.random() * LEAF_COLORS.length) | 0] };
}
(function initDeco() {
  for (var i = 0; i < 12; i++) leaves.push(newLeaf(true));
  for (var j = 0; j < 3; j++) clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 130, s: 0.7 + Math.random() * 0.7, v: 6 + Math.random() * 8 });
})();

// ---------- 启动 ----------
applyMute();
updateHUD();
fit();
showMenu();
// 调试/测试钩子（不影响游戏逻辑）
window.__cd = {
  get state() { return state; }, get score() { return score; },
  get combo() { return combo; }, get lives() { return lives; },
  get items() { return items.length; }, get basketX() { return basket.x; },
  get misses() { return missStreak; }, get best() { return best; },
  get stun() { return basket.stun; }, get flash() { return flash; },
  get itemList() { return items; }
};
</script>
